<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client for cs5200Team5 API</title>
    <link rel="stylesheet" href="app.css">
</head>
<body onload="setupCountriesList()">
    <hr />
    <h1>Address Search - Team 5</h1>
    <hr />
    <!-- <form id="mode-form">
        <input type="radio" value="multi-country" id="multi-country" name="mode" onchange="handleModeChange(this)">
        <label for="multi-country">Multi-Country Search</label>
        <input type="radio" value="single-country" id="single-country" name="mode" onchange="handleModeChange(this)">
        <label for="single-country">Single Country Search</label>
    </form> -->
    <form id="multi-country-form" class="country-form">
        <div class="first-line">
            <select id="selected-countries-select">
                <option value="" selected disabled hidden>Select a country</option>
            </select>
            <button id="selected-countries-add" onclick="addCountry()">+</button>
        </div>
        <ul id="selected-countries-list"></ul>
        <hr>
        <div class="second-line">
            <div>
                <label for="street">Street</label>
                <input type="text" id="street" name="street">
            </div>
            <div>
                <label for="city">City</label>
                <input list="cities" id="city" name="city">
                <datalist id="cities"></datalist>
            </div>
            <div>
                <label for="county">County</label>
                <input list="counties" id="county" name="county">
                <datalist id="counties"></datalist>
            </div>
            <div>
                <label for="state">State</label>
                <input list="states" id="state" name="state">
                <datalist id="states"></datalist>
            </div>
            <div>
                <label for="postal-code">Postal Code</label>
                <input list="postal-codes" id="postal-code" name="postal-code">
                <datalist id="postal-codes"></datalist>
            </div>
        </div>
        <button type="submit" onclick="parseForm()">Submit</button>
    </form>
    <div class="addresses" id="addresses"></div>
    <div class="pagination" id="pagination"></div>
    <script src="app.js"></script>
</body>
</html>
