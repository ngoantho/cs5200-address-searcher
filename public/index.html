<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client for cs5200Team5 API</title>
    <link rel="stylesheet" href="app.css">
</head>
<body onload="setupCountriesList()">
    <hr />
    <h1>Address Search - Team 5</h1>
    <hr />
    <form id="multi-country-form" class="country-form">
        <div class="first-line">
            <select id="selected-countries-select">
                <option value="" selected disabled hidden>Select a country</option>
            </select>
            <button id="selected-countries-add" onclick="addCountry()">+</button>
        </div>
        <ul id="selected-countries-list"></ul>
        <hr>
        <div class="second-line">
            <fieldset id="fieldset_name">
                <legend>Name</legend>
            </fieldset>
            <fieldset id="fieldset_street">
                <legend>Street</legend>
            </fieldset>
            <fieldset id="fieldset_city">
                <legend>City</legend>
            </fieldset>
            <fieldset id="fieldset_county">
                <legend>County</legend>
            </fieldset>
            <fieldset id="fieldset_prefecture">
                <legend>Prefecture</legend>
            </fieldset>
            <fieldset id="fieldset_province">
                <legend>Province</legend>
            </fieldset>
            <fieldset id="fieldset_state">
                <legend>State</legend>
            </fieldset>
            <fieldset id="fieldset_zip">
                <legend>Postal Code</legend>
            </fieldset>
        </div>
        <button type="submit" onclick="parseForm()">Search</button>
    </form>
    <div class="addresses" id="addresses"></div>
    <div class="pagination" id="pagination"></div>
    <script src="app.js"></script>
</body>
</html>
